services:
  web:
    image: registry.fpfis.eu/digit/devsecops/httpd-php:8.3-dev
    working_dir: /var/www/html
    ports:
      - 8080:8080
    volumes:
      - .:/var/www/html # Non Mac users.
      # - nfsmount:/var/www/html # Mac Users with the nfsmount volume.
    environment:
      COMPOSERVER: "--2"
      XDEBUG_CONFIG: "client_host=172.17.0.1" # Non-Mac users.
      # XDEBUG_CONFIG: "client_host=host.docker.internal" # Mac users.
      XDEBUG_MODE: "develop, debug"
      PHP_IDE_CONFIG: "serverName=Docker"
      DRUPAL_DATABASE_NAME: "drupal"
      DRUPAL_DATABASE_USERNAME: "root"
      DRUPAL_DATABASE_PASSWORD: ""
      DRUPAL_DATABASE_HOST: "mysql"
      DRUPAL_DATABASE_PORT: "3306"
      DRUPAL_DATABASE_PREFIX: ""
      # Enable step debugging for all PHP request. See ./README.md#step-debugging for more information.
      # XDEBUG_SESSION: 1
      EPOETRY_SERVICE_URL: "http://web:8080/build/epoetry-mock/server"
      EPOETRY_APPLICATION_NAME: "digit"
      EPOETRY_AUTH_CERT_SERVICE_URL: ""
      EPOETRY_AUTH_CERT_PATH: ""
      EPOETRY_AUTH_CERT_PASSWORD: ""
      EPOETRY_AUTH_EU_LOGIN_BASEPATH: ""
      EPOETRY_TICKET_VALIDATION_EU_LOGIN_BASEPATH: ""
      EPOETRY_TICKET_VALIDATION_JOB_ACCOUNT: ""
      EPOETRY_TICKET_VALIDATION_CALLBACK_URL: ""
      EPOETRY_TICKET_VALIDATION_ON: ""
      ETRANS_SERVICE_URL: ""
      ETRANS_APPLICATION_NAME: ""
      ETRANS_PASSWORD: ""
      CDT_TOKEN_API_ENDPOINT: "https://example.com/token"
      CDT_MAIN_API_ENDPOINT: "https://example.com/v2/CheckConnection"
      CDT_REFERENCE_DATA_API_ENDPOINT: "https://example.com/v2/requests/businessReferenceData"
      CDT_VALIDATE_API_ENDPOINT: "https://example.com/v2/requests/validate"
      CDT_REQUESTS_API_ENDPOINT: "https://example.com/v2/requests"
      CDT_IDENTIFIER_API_ENDPOINT: "https://example.com/v2/requests/requestIdentifierByCorrelationId/:correlationId"
      CDT_STATUS_API_ENDPOINT: "https://example.com/v2/requests/:requestyear/:requestnumber"
      CDT_FILE_API_ENDPOINT: "https://example.com/v2/requests/:requestyear/:requestnumber/targets-base64"
      CDT_CLIENT: "test_client"
      CDT_USERNAME: "test_username"
      CDT_PASSWORD: "test_password"
      CDT_API_KEY: "test_api_key"
  mysql:
    image: percona/percona-server:8.0
    command: --innodb-log-file-size=1G --max_allowed_packet=1G --innodb-buffer-pool-size=512M --wait_timeout=3000 --net_write_timeout=3000 --log_error_verbosity=3 --skip-log-bin --innodb-flush-log-at-trx-commit=2 --innodb-read-io-threads=16 --innodb-write-io-threads=16
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
#    ports:
#      - 3306:3306

  # Visit localhost:7900 to access the browser.
  selenium:
    image: selenium/standalone-chrome:4.1.3-20220405
    environment:
      - DISPLAY=:99
      - SCREEN_WIDTH=1280
      - SCREEN_HEIGHT=800
      - VNC_NO_PASSWORD=1
    ports:
      - '7900:7900'
    shm_size: 2g

#### Mac users: uncomment the "volumes" key to enable the NFS file sharing. You can find more information about Docker for Mac here: https://github.com/openeuropa/openeuropa/blob/master/docs/starting/tooling.md#using-docker-on-macos

