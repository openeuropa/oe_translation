name: ci
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - 3.x

jobs:
  automated-tests:
    uses: openeuropa/github-ci/.github/workflows/drupal-ci.yml@main
    with:
      run_phpunit_batches: TRUE
      php_versions: '["8.3", "8.4"]'
      core_versions: '["~11.4.0"]'
